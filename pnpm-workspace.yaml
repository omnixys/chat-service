allowBuilds:
  '@apollo/protobufjs': true
  '@nestjs/core': true
  '@prisma/engines': true
  '@swc/core': true
  argon2: true
  cpu-features: false
  esbuild: true
  prisma: true
  protobufjs: true
  ssh2: false
minimumReleaseAgeExclude:
  - '@omnixys/cache-ts@4.4.1'
  - '@omnixys/context-ts@4.1.1'
  - '@omnixys/contracts-ts@4.5.0'
  - '@omnixys/graphql-ts@4.4.2'
  - '@omnixys/http-ts@2.1.1'
  - '@omnixys/kafka-ts@4.3.1'
  - '@omnixys/logger-ts@4.2.0'
  - '@omnixys/observability-ts@4.1.1'
  - '@omnixys/security-ts@5.1.1'
onlyBuiltDependencies:
  - '@apollo/protobufjs'
  - '@nestjs/core'
  - '@prisma/engines'
  - '@swc/core'
  - argon2
  - esbuild
  - prisma
  - protobufjs
overrides:
  '@nestjs/apollo@13.4.5>@apollo/server-plugin-landing-page-graphql-playground': '-'
  fastify: 5.8.5
patchedDependencies:
  '@nestjs/apollo@13.4.5': patches/nest-apollo-13.4.5.patch
