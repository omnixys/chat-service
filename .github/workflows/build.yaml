# Omnixys Workflow Suite – ci.yml
# Purpose: Continuous Integration pipeline for all pushes and pull requests.
# Language: Python (uv)

name: Continuous Integration – Omnixys

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write
  id-token: write
  actions: read
  issues: write
  pull-requests: write

env:
  COSIGN_EXPERIMENTAL: 'true'
  IMAGE_NAME: ${{ secrets.DOCKER_USER }}/${{ vars.SERVICE }}-service
  IMAGE_NAME_REPOSITORY: ghcr.io/${{ github.repository }}
  PYTHON_VERSION: '3.14.7'

jobs:
  ci:
    name: Run Lint, Typecheck and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Restore uv cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint check
        run: uv run ruff check src/

      - name: Typecheck
        run: uv run mypy src/

      # - name: Run tests
      #   run: uv run pytest --tb=short -q